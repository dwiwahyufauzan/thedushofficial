<!doctype html>
<html lang="id" class="scroll-smooth">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />

	<!-- Google Fonts Preconnect -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

	<!-- Fonts: Clash Display (Fontshare) + Space Grotesk + DM Sans (body) -->
	<link
		href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
		rel="stylesheet" />
	<link
		href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap"
		rel="stylesheet" />

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-stone-50 text-stone-900 antialiased overflow-x-hidden min-h-screen">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
